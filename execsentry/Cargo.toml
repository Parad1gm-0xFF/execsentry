[package]
name = "execsentry"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
execsentry-common = { path = "../execsentry-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
clap = { workspace = true, features = ["derive"] }
libc = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
] }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# Dépendance non utilisée directement : elle force cargo à recompiler le chargeur
# quand la crate eBPF change (ses cibles *lib*), le reste étant géré par aya-build.
execsentry-ebpf = { path = "../execsentry-ebpf" }

[[bin]]
name = "execsentry"
path = "src/main.rs"

# La dépendance `execsentry-ebpf` n'est pas appelée directement : elle sert à
# l'invalidation du cache (aya-build pilote la compilation eBPF réelle).
[lints.cargo]
unused_dependencies = "allow"
