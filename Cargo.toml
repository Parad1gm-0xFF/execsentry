[workspace]
resolver = "2"
members = [
    "execsentry",
    "execsentry-common",
    "execsentry-ebpf",
]
default-members = ["execsentry", "execsentry-common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
# `std` est requis pour `clap` ; `help`/`usage`/`error-context` restaurent l'aide
# et les messages d'erreur (désactivés par `default-features = false`).
clap = { version = "4.5.20", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }

libc = { version = "0.2.159", default-features = false }
tokio = { version = "1.53.3", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.execsentry-ebpf]
debug = 2
codegen-units = 1
strip = false
